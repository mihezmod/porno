
name: RUN MEMES

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: select cunts to run
        required: true
        type: choice
        default: all
        options:
          - all

jobs:
  run-test:
    runs-on: ubuntu-latest
    name: SPERMA
    steps:
      - name: copycode
        uses: actions/checkout@v4

      - name: Install PIZDA
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -v -s
